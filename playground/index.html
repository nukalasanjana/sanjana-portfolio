<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Playground — Sanjana Nukala's graphics, experiments, and creative work." />
  <title>Playground — Sanjana Nukala</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/playground.css" />
</head>
<body>

  <site-header></site-header>

  <!-- ── HERO ─────────────────────────────────────────────── -->
  <section class="pg-hero">
    <div class="container">
      <h1>Play<em>ground</em></h1>
      <p class="t-large">
        Graphics, experiments, and things made for the joy of making.
      </p>
    </div>
  </section>

  <!-- ── GALLERY ───────────────────────────────────────────── -->
  <div class="container">

    <!-- ── UNC PM Club ── -->
    <div class="pg-section reveal">
      <h2 class="pg-section-title">UNC PM Club</h2>
      <p class="pg-section-sub">Branding &amp; social media graphics</p>
    </div>
    <div class="pg-gallery">
      <figure class="pg-item reveal">
        <img src="../resources/playground/UNC PM Club/Instagram post - 1.png" alt="Exec Board Positions Open — UNC PM Club" data-lightbox />
      </figure>
      <figure class="pg-item reveal">
        <img src="../resources/playground/UNC PM Club/Instagram post - 2.png" alt="UNC PM Club Instagram post 2" data-lightbox />
      </figure>
      <figure class="pg-item reveal">
        <img src="../resources/playground/UNC PM Club/Perplexity Post.png" alt="UNC PM Club × Perplexity Stock Pitch Competition" data-lightbox />
      </figure>
      <figure class="pg-item reveal">
        <img src="../resources/playground/UNC PM Club/Instagram post - 3.png" alt="UNC PM Club Instagram post 3" data-lightbox />
      </figure>
      <figure class="pg-item reveal">
        <img src="../resources/playground/UNC PM Club/Instagram post - 5.png" alt="UNC PM Club Instagram post 5" data-lightbox />
      </figure>
      <figure class="pg-item reveal">
        <img src="../resources/playground/UNC PM Club/Perplexity Post 2.png" alt="UNC PM Club × Perplexity post 2" data-lightbox />
      </figure>
      <figure class="pg-item pg-item--wide reveal">
        <img src="../resources/playground/UNC PM Club/Banner.png" alt="UNC PM Club Banner" data-lightbox />
      </figure>
      <figure class="pg-item pg-item--wide reveal">
        <img src="../resources/playground/UNC PM Club/Linkdln Banner with Copy.png" alt="UNC PM Club LinkedIn Banner" data-lightbox />
      </figure>
    </div>

    <!-- ── App Concepts ── -->
    <div class="pg-section reveal">
      <h2 class="pg-section-title">App Concepts</h2>
      <p class="pg-section-sub">UI design explorations</p>
    </div>
    <div class="pg-gallery">
      <figure class="pg-item reveal">
        <img src="../resources/playground/habit-io.png" alt="habit.io — habit tracking app concept" data-lightbox />
        <figcaption>habit.io</figcaption>
      </figure>
      <figure class="pg-item reveal">
        <img src="../resources/playground/fetchr.png" alt="Fetchr — pet adoption app concept" data-lightbox />
        <figcaption>Fetchr — pet adoption</figcaption>
      </figure>
    </div>

    <!-- ── Web Concepts ── -->
    <div class="pg-section reveal">
      <h2 class="pg-section-title">Web Concepts</h2>
      <p class="pg-section-sub">Redesigns &amp; UI experiments</p>
    </div>
    <div class="pg-gallery pg-gallery--single">
      <figure class="pg-item reveal">
        <img src="../resources/playground/404-design.png" alt="Glossier 404 page redesign concept" data-lightbox />
        <figcaption>Glossier — 404 redesign concept</figcaption>
      </figure>
    </div>

  </div>

  <!-- ── FOOTER ────────────────────────────────────────────── -->
  <footer class="site-footer">
    <p>Sanjana Nukala &nbsp;·&nbsp; © 2026</p>
    <p>Product & UI/UX Designer</p>
  </footer>

  <script src="../js/main.js"></script>
</body>
</html>
